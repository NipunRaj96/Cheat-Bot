[project]
name = "cheat-bot"
version = "1.0.0"
description = "Auto-submits the top-voted community solution to LeetCode's Daily Challenge. Because streaks shouldn't require effort."
authors = [{ name = "Nipun Kumar" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rookiepy>=0.5.0",
    "PyNaCl>=1.5.0",
]

[project.scripts]
start = "src.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
