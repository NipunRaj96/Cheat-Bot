name: Cheat-Bot Daily

on:
  schedule:
    # 00:30 UTC = 6:00 AM IST — 30 mins after LeetCode rolls the new daily
    - cron: "30 0 * * *"
  workflow_dispatch: {}

concurrency:
  group: cheat-bot-daily
  cancel-in-progress: false

# Needed so the job can push the daily run-log commit with GITHUB_TOKEN
permissions:
  contents: write

jobs:
  solve:
    runs-on: ubuntu-latest
    # 3 attempts x up to 90s verdict polling, plus setup and the log commit
    timeout-minutes: 10
    env:
      LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
      LEETCODE_CSRFTOKEN: ${{ secrets.LEETCODE_CSRFTOKEN }}
      PREFERRED_LANG: ${{ secrets.PREFERRED_LANG }}
      MAX_FALLBACK_ATTEMPTS: 3

      # Multi-account (optional) — uncomment and add your secrets
      # ACCOUNTS: ${{ secrets.ACCOUNTS }}
      # NIPUN_LEETCODE_SESSION: ${{ secrets.NIPUN_LEETCODE_SESSION }}
      # NIPUN_LEETCODE_CSRFTOKEN: ${{ secrets.NIPUN_LEETCODE_CSRFTOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        id: bot
        run: python -m src.main
        # Exit codes:
        #   0 = Accepted
        #   1 = Solution failed (WA/TLE on all attempts)
        #   2 = Auth failed (cookies stale)

      # ── Commit the run log every day, whatever the bot's outcome ─────
      # Authored as the repo owner (via their GitHub noreply address), not
      # github-actions[bot], so the commit counts on the owner's contribution
      # graph. Also keeps the repo active so GitHub never auto-disables this
      # scheduled workflow after 60 days without activity.
      - name: Commit daily run log
        if: always()
        env:
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.repository_owner_id }}
          BOT_OUTCOME: ${{ steps.bot.outcome }}
        run: |
          set -euo pipefail
          git config user.name "$OWNER"
          git config user.email "${OWNER_ID}+${OWNER}@users.noreply.github.com"

          LOG=logs/runs.jsonl
          mkdir -p logs
          touch "$LOG"
          # If the bot crashed before writing its own log line, record the run anyway
          if git diff --quiet -- "$LOG"; then
            printf '{"ts": "%s", "account": "workflow", "status": "NoLogEntry", "bot_outcome": "%s"}\n' \
              "$(date -u +%FT%T+00:00)" "$BOT_OUTCOME" >> "$LOG"
          fi

          git add "$LOG"
          git commit -m "chore: daily run log $(date -u +%F) (bot: ${BOT_OUTCOME})"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # ── Shown only on auth failure (exit code 2) ──────────────────────
      - name: Cookies are stale — action required
        if: failure() && steps.bot.outcome == 'failure'
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║                  COOKIE REFRESH NEEDED                  ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║  Your LeetCode session cookies have expired.             ║"
          echo "║                                                          ║"
          echo "║  Run this on your local machine:                         ║"
          echo "║                                                          ║"
          echo "║    python scripts/push_cookies_to_github.py --trigger    ║"
          echo "║                                                          ║"
          echo "║  This will:                                              ║"
          echo "║    1. Pull fresh cookies from your browser               ║"
          echo "║    2. Push them to GitHub secrets automatically          ║"
          echo "║    3. Re-trigger this workflow                           ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          exit 1
